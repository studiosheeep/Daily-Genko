<svg xmlns="http://www.w3.org/2000/svg" width="110" height="120" viewBox="0 0 110 120">
  <defs>
    <radialGradient id="body" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- 影 -->
  <ellipse cx="55" cy="114" rx="30" ry="4" fill="rgba(16,185,129,0.25)"/>

  <!-- 頭の葉っぱ -->
  <path d="M55 22 C 52 12, 44 6, 34 6 C 36 16, 44 22, 55 22 Z" fill="url(#leaf)"/>
  <path d="M55 22 C 58 10, 68 4, 78 6 C 74 16, 66 22, 55 22 Z" fill="url(#leaf)"/>
  <path d="M55 24 L 55 16" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 体 -->
  <circle cx="55" cy="64" r="44" fill="url(#body)"/>

  <!-- 目 -->
  <ellipse cx="40" cy="58" rx="5" ry="6" fill="#0f172a"/>
  <ellipse cx="70" cy="58" rx="5" ry="6" fill="#0f172a"/>
  <circle cx="41.8" cy="55.6" r="1.8" fill="#ffffff"/>
  <circle cx="71.8" cy="55.6" r="1.8" fill="#ffffff"/>

  <!-- ほっぺ -->
  <ellipse cx="31" cy="70" rx="6" ry="3.5" fill="#fb7185" opacity="0.55"/>
  <ellipse cx="79" cy="70" rx="6" ry="3.5" fill="#fb7185" opacity="0.55"/>

  <!-- 口 -->
  <path d="M48 70 Q 55 77, 62 70" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ペン（原稿を応援） -->
  <g transform="rotate(35 92 86)">
    <rect x="88" y="66" width="8" height="30" rx="2" fill="#3b82f6"/>
    <rect x="88" y="66" width="8" height="6" rx="2" fill="#1e3a8a"/>
    <path d="M88 96 L 96 96 L 92 104 Z" fill="#fde68a"/>
    <path d="M90.6 100.6 L 93.4 100.6 L 92 104 Z" fill="#0f172a"/>
  </g>
</svg>
